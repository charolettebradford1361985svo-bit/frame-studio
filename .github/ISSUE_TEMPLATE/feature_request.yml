name: Feature request / 功能建议
description: Describe a real game-asset workflow / 描述实际素材制作需求
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do? / 想完成什么？
      description: Describe the asset type, workflow and current difficulty.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement / 建议如何改进
      description: A small example or expected result is welcome.
